services:
  stock-data:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: stock-data:latest
    container_name: stock-data
    restart: always
    ports:
      # 只监听本机，由宿主机 Nginx 反向代理对外提供 HTTPS
      - "127.0.0.1:8000:8000"
    environment:
      # 部署到公网建议设置访问口令，留空则不校验
      STOCK_TOOL_TOKEN: "${STOCK_TOOL_TOKEN:-}"
      STOCK_TOOL_INTERVAL: "0.35"
      # 海外服务器上东财行情会走延时源，设为 tencent 取实时行情
      STOCK_TOOL_QUOTE_SOURCE: "${STOCK_TOOL_QUOTE_SOURCE:-auto}"
      TZ: Asia/Shanghai
    volumes:
      # 相对 compose 文件所在目录：数据落在仓库根目录的 data/
      - ../data:/srv/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
