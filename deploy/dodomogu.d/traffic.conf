# 访问统计报表路由（GoAccess 生成的静态页，由 cron 定时刷新）
#
# 安装位置：/etc/nginx/conf.d/dodomogu.d/traffic.conf
# 由 dodomogu.conf 的 include 引入，不要单独放进 conf.d/。
#
# 报表里包含访客 IP、UA、请求路径，属于敏感信息，所以加了 basic auth。
# 账号文件：/etc/nginx/.htpasswd-traffic（htpasswd 或 openssl passwd -apr1 生成）

location = /traffic {
    return 301 /traffic/;
}

location ^~ /traffic/ {
    alias /var/www/traffic/;
    index index.html;
    auth_basic "traffic";
    auth_basic_user_file /etc/nginx/.htpasswd-traffic;
    # 报表每 10 分钟刷新一次，不要让浏览器缓存
    add_header Cache-Control "no-store";
}
