# stock 项目路由（/stock/ -> 股票分析看板，后端监听 127.0.0.1:8000）
#
# proxy_pass 结尾带 /，会剥掉 /stock 前缀，后端因此收到 /、/api/...、/style.css，
# 与 app/main.py 的路由一一对应；前端资源与接口都按相对路径解析，剥掉前缀后仍能正常加载。
#
# 安装位置：/etc/nginx/conf.d/dodomogu.d/stock.conf
# 由 dodomogu.conf 里的 include 引入，不要单独放进 conf.d/。
#
# 本机 nginx 是手工启动的（systemd 单元 nginx.service 处于 failed 状态，
# 与运行中的 master 不是同一份进程管理），改完配置用下面方式生效：
#     nginx -t && nginx -s reload
# 不要用 systemctl restart nginx：systemd 会去启动第二个 nginx，端口冲突后失败。

location = /stock {
    return 301 /stock/;
}

location ^~ /stock/ {
    proxy_pass http://127.0.0.1:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 冷启动要依次抓行情/K线/财报/估值/同业，留足时间避免 504
    proxy_read_timeout 120s;
}
