# 阿里云 ECS 上的 Nginx 反向代理示例
#   sudo cp deploy/nginx.conf /etc/nginx/conf.d/stock-data.conf && sudo nginx -s reload
# 需要 HTTPS 时执行：sudo certbot --nginx -d stock.example.com
server {
    listen 80;
    server_name stock.example.com;   # 换成你的域名或 ECS 公网 IP

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json;

    # 只有第三方库走长缓存（文件名带版本），自己的前端文件每次都校验，避免更新后用户看到旧页面
    location /vendor/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public";
    }

    location ~* ^/(style\.css|app\.js)$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
