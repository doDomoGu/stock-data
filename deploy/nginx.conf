# dodomogu.com 反向代理配置（站点挂在 /stock 子路径下）
#
# 两种用法二选一：
#   A. dodomogu.com 目前没有 server 块 —— 整个文件复制到 /etc/nginx/conf.d/stock-data.conf
#   B. 站点已有 server 块 —— 只把下面三个 location 段并入那个 server 块，
#      不要重复定义 listen / server_name，否则 nginx 会报 conflicting server name
#
# 改完务必先 `sudo nginx -t` 再 `sudo systemctl reload nginx`。

server {
    listen 80;
    listen [::]:80;
    server_name dodomogu.com www.dodomogu.com;

    # 访问口令通过环境变量 STOCK_TOOL_TOKEN 设置后，页面用 /stock/?token=xxx 打开；
    # 建议开启 HTTPS 后再对外使用：sudo certbot --nginx -d dodomogu.com -d www.dodomogu.com

    # 子目录必须带结尾的斜杠：没有斜杠时页面里的相对资源会按站点根目录解析而 404
    location = /stock {
        return 301 /stock/;
    }

    # 第三方库（文件名带版本）长缓存
    location /stock/vendor/ {
        proxy_pass http://127.0.0.1:8000/vendor/;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public";
    }

    # 其余请求：结尾的 / 会把 /stock/ 前缀剥掉再转发
    #   /stock/                -> /             （页面）
    #   /stock/api/stock/xxx   -> /api/stock/xxx（接口）
    #   /stock/style.css       -> /style.css    （前端文件，后端已带 no-cache）
    location /stock/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
